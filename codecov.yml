codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 0.2%
        if_ci_failed: error
    patch:
      # New code comes with tests.
      default:
        target: 80%
        threshold: 0.2%
        if_ci_failed: error

# No `flags` and no `component_management`: a single aggregated report, with no per-module breakdown.
# The layout below leaves out `components` and `flags` for the same reason.
comment:
  layout: "condensed_header, diff, files, condensed_footer"
  behavior: default
  require_changes: false
  hide_project_coverage: false

ignore:
  - "**/build/generated/**"
  # Docs: lets the empty upload of a docs-only PR pass.
  - "docs/**"
  - "art/**"
  - "**/*.md"
  - "LICENSE"
