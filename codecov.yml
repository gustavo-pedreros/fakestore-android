codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 0.2%
        if_ci_failed: error
    patch:
      # New code comes with tests.
      default:
        target: 80%
        threshold: 0.2%
        if_ci_failed: error

# Coverage per layer, from the same merged report. No component statuses: project and patch stay the only gates.
component_management:
  individual_components:
    - component_id: domain
      paths:
        - "catalog/domain/**"
        - "favorites/domain/**"
        - "shared/kernel/**"
    - component_id: data
      paths:
        - "catalog/data/**"
        - "favorites/data/**"
    - component_id: presentation
      paths:
        - "catalog/ui/**"
        - "favorites/ui/**"
        - "app/**"
    - component_id: design_system
      name: design system
      paths:
        - "core/designsystem/**"
    - component_id: infrastructure
      paths:
        - "core/network/**"
        - "core/database/**"
        - "core/connectivity/**"
        - "core/common/**"

comment:
  layout: "condensed_header, diff, components, files, condensed_footer"
  behavior: default
  require_changes: false
  hide_project_coverage: false

ignore:
  - "**/build/generated/**"
  # Docs: lets the empty upload of a docs-only PR pass.
  - "docs/**"
  - "art/**"
  - "*.md"
  - "**/*.md"
  - "LICENSE"
