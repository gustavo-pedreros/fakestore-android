# Analytics conventions for this project.
#
# The guardrails read this file, so a convention is configuration rather than a constant
# buried in a verifier. Change it here and the rules follow.
#
# Deliberately .properties and not .json/.yaml: java.util.Properties is in the JDK, so the
# default guardrail backend needs no dependency at all.

# Fully qualified name of the marker interface every analytics event implements.
# This is the anchor for every rule: the rules find events by TYPE, not by name, so the
# naming convention below can change without breaking anything.
marker=cl.gus.labs.fakestore.analytics.AnalyticsEvent

# Suffix an event container's name must end with. Both `<suffix>` and `<suffix>s` are
# accepted, so `CheckoutAnalyticsEvent` and `CheckoutAnalyticsEvents` both pass.
#
# `AnalyticsEvent` is the recommended default. Plain `Event` is very generic and will collide
# with domain events, MVI side effects and UI events; a more specific suffix is what makes the
# reserved-suffix rule below cheap enough to be worth enabling.
container.suffix=AnalyticsEvents

# Optional: require containers to live in a package ending with this segment.
# Leave empty to disable. Useful for teams that would rather not enforce class names at all —
# set container.suffix.enforced=false and rely on this instead.
container.package=analytics
container.suffix.enforced=true

# Reserve the suffix project-wide: any class ending in it that is NOT an analytics event
# fails the build.
#
# Off by default. It is the most invasive rule here, because it constrains people who are not
# thinking about analytics at all. With a specific suffix like `AnalyticsEvents` it costs
# almost nothing; with plain `Event` it will fight your codebase.
container.suffix.reserved=false

# Android types an event constructor must never accept. An event that needs one of these has
# regressed into a service locator: it becomes untestable without static mocking, and can only
# be created where the framework is available, which in practice means the UI layer.
forbidden.parameter.types=Context,Activity,Fragment,View,Application,Resources,Bundle,Intent,Lifecycle

# Directories to skip while scanning.
scan.exclude=build,.git,.gradle,generated
