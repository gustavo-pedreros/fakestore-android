<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Only the bundle knows the source</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    --paper: #fafaf7; --ink: #0b0b0c; --muted: #5c5c56; --accent: #c62a1b;

  .frame { max-width: 1280px; width: 100%; }
  svg { width: 100%; min-width: 900px; display: block; }
</style>

<body>
<div class="frame">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="remote-config-modules-title remote-config-modules-desc">
  <title id="remote-config-modules-title">Only the bundle knows the source</title>
  <desc id="remote-config-modules-desc">Module graph of the remote config proposal: the app depends on a bundle that picks the value source, JSON over HTTP today and Firebase planned for stage D; the source and the runtime depend on a pure-Kotlin API module, which is also the only remote config module the contexts' data modules see; a debug-only module adds overrides to the runtime.</desc>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5c5c56"/></marker>

    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3e5c76"/></marker>
    <marker id="arrow-planned" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8a8a82"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#fafaf7"/>

  <text x="40" y="108" fill="#0b0b0c" font-size="40" font-family="'Instrument Serif', serif" font-weight="400" letter-spacing="-0.01em">Only the bundle knows the source</text>
  <text x="40" y="132" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.02em">remote config as modules · contexts declare keys in data · domain and ui never see :remoteconfig</text>

  <line x1="740" y1="200" x2="1040" y2="200" stroke="#8a8a82" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-planned)"/>
  <path d="M 540,312 H 372 Q 364,312 364,320 V 392" fill="none" stroke="#5c5c56" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="640" y1="344" x2="640" y2="392" stroke="#5c5c56" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="640" y1="456" x2="640" y2="504" stroke="#5c5c56" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 1140,232 V 416 Q 1140,424 1132,424 H 740" fill="none" stroke="#8a8a82" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-planned)"/>

  <rect x="1052" y="176" width="40" height="16" rx="2" fill="none" stroke="rgba(11,11,12,0.20)" stroke-width="0.8"/>
  <text x="1072" y="188" fill="#8a8a82" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.10em">DEBUG</text>

  <text x="1140" y="224" fill="#8a8a82" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">:remoteconfig:debug</text>

  <text x="130" y="336" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">GitHub raw</text>

  <text x="916" y="336" fill="#8a8a82" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">:remoteconfig:source-firebase</text>

  <!-- :remoteconfig:source-http -->
  <rect x="264" y="392" width="200" height="64" rx="6" fill="#fafaf7"/>
  <rect x="264" y="392" width="200" height="64" rx="6" fill="#ffffff" stroke="#0b0b0c" stroke-width="1"/>
  <rect x="276" y="400" width="48" height="16" rx="2" fill="none" stroke="#0b0b0c" stroke-opacity="0.40" stroke-width="0.8"/>

  <text x="364" y="448" fill="#5c5c56" font-size="10" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">:remoteconfig:source-http</text>

  <rect x="540" y="392" width="200" height="64" rx="6" fill="#fafaf7"/>
  <rect x="540" y="392" width="200" height="64" rx="6" fill="rgba(11,11,12,0.05)" stroke="#5c5c56" stroke-width="1"/>

  <text x="640" y="560" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">:remoteconfig:api</text>

  <rect x="816" y="504" width="200" height="64" rx="6" fill="#fafaf7"/>
  <rect x="816" y="504" width="200" height="64" rx="6" fill="rgba(11,11,12,0.05)" stroke="#5c5c56" stroke-width="1"/>
  <rect x="828" y="512" width="36" height="16" rx="2" fill="none" stroke="#5c5c56" stroke-opacity="0.40" stroke-width="0.8"/>

  <!-- Legend -->
  <line x1="40" y1="636" x2="1240" y2="636" stroke="rgba(11,11,12,0.12)" stroke-width="0.8"/>

  <line x1="120" y1="652" x2="144" y2="652" stroke="#5c5c56" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="152" y="656" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">depends on</text>
  <line x1="256" y1="652" x2="280" y2="652" stroke="#8a8a82" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-planned)"/>
  <text x="288" y="656" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">debug only · stage D</text>

  <text x="598" y="656" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">the only remote config module a context sees</text>
