<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The SDUI fallback ladder</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper: #fafaf7; --ink: #0b0b0c; --muted: #5c5c56; --accent: #c62a1b;
    --sans: 'Space Grotesk', system-ui, sans-serif; --serif: 'Instrument Serif', serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--sans); background: var(--paper); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
  }
  .frame { max-width: 1280px; width: 100%; }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fallback-ladder-title fallback-ladder-desc">
  <title id="fallback-ladder-title">The SDUI fallback ladder</title>
  <desc id="fallback-ladder-desc">Four-level fallback ladder for the server-driven UI: fresh contract from the server, contract cached in Room, contract shipped in the APK assets and, as the floor, the native screen that is already built.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5c5c56"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c62a1b"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3e5c76"/></marker>
    <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0b0b0c"/></marker>
    <marker id="arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#5c5c56" stroke-width="1.2"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#fafaf7"/>

  <text x="40" y="60" fill="#5c5c56" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" letter-spacing="0.18em">DESIGNED, NOT BUILT · FAKESTORE ANDROID</text>
  <text x="40" y="108" fill="#0b0b0c" font-size="40" font-family="'Instrument Serif', serif" font-weight="400" letter-spacing="-0.01em">The SDUI fallback ladder</text>
  <text x="40" y="132" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.02em">The real risk of SDUI is the server leaving you with no UI · each level is used only when the one above fails</text>

  <line x1="88" y1="224" x2="88" y2="556" stroke="#5c5c56" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="52" y="212" fill="#5c5c56" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" letter-spacing="0.14em">DEGRADES</text>
  <rect x="120" y="208" width="1080" height="88" rx="6" fill="#fafaf7"/>
  <rect x="120" y="208" width="1080" height="88" rx="6" fill="#ffffff" stroke="#0b0b0c" stroke-width="1"/>
  <rect x="144" y="244" width="26" height="16" rx="2" fill="none" stroke="#0b0b0c" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="157" y="256" fill="#0b0b0c" fill-opacity="0.85" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.10em">01</text>
  <text x="200" y="258" fill="#0b0b0c" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif">Server</text>
  <text x="440" y="257" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">fresh contract</text>
  <text x="1176" y="257" fill="#8a8a82" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">if unreachable  ↓</text>
  <rect x="120" y="300" width="1080" height="88" rx="6" fill="#fafaf7"/>
  <rect x="120" y="300" width="1080" height="88" rx="6" fill="#f2f2ee" stroke="#5c5c56" stroke-width="1"/>
  <rect x="144" y="336" width="26" height="16" rx="2" fill="none" stroke="#5c5c56" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="157" y="348" fill="#5c5c56" fill-opacity="0.85" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.10em">02</text>
  <text x="200" y="350" fill="#0b0b0c" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif">Room</text>
  <text x="440" y="349" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">contract cached on disk</text>
  <text x="1176" y="349" fill="#8a8a82" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">if empty  ↓</text>
  <rect x="120" y="392" width="1080" height="88" rx="6" fill="#fafaf7"/>
  <rect x="120" y="392" width="1080" height="88" rx="6" fill="#edede6" stroke="#5c5c56" stroke-width="1"/>
  <rect x="144" y="428" width="26" height="16" rx="2" fill="none" stroke="#5c5c56" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="157" y="440" fill="#5c5c56" fill-opacity="0.85" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.10em">03</text>
  <text x="200" y="442" fill="#0b0b0c" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif">Bundled assets</text>
  <text x="440" y="441" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">contract shipped in the APK</text>
  <text x="1176" y="441" fill="#8a8a82" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">if unparseable  ↓</text>
  <rect x="120" y="484" width="1080" height="88" rx="6" fill="#fafaf7"/>
  <rect x="120" y="484" width="1080" height="88" rx="6" fill="rgba(198,42,27,0.08)" stroke="#c62a1b" stroke-width="1"/>
  <rect x="144" y="520" width="26" height="16" rx="2" fill="none" stroke="#c62a1b" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="157" y="532" fill="#c62a1b" fill-opacity="0.85" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.10em">04</text>
  <text x="200" y="534" fill="#0b0b0c" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif">Native screen</text>
  <text x="440" y="533" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">Compose · Stage 1, already built</text>
  <text x="1176" y="533" fill="#c62a1b" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">the app is never blank</text>
  <line x1="40" y1="636" x2="1240" y2="636" stroke="rgba(11,11,12,0.12)" stroke-width="0.8"/>
  <text x="40" y="656" fill="#5c5c56" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" letter-spacing="0.14em">LEGEND</text>
  <rect x="148" y="645" width="14" height="12" rx="2" fill="#ffffff" stroke="#0b0b0c" stroke-width="1"/>
  <text x="170" y="656" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">remote or cached contract</text>
  <rect x="386" y="645" width="14" height="12" rx="2" fill="rgba(198,42,27,0.08)" stroke="#c62a1b" stroke-width="1"/>
  <text x="408" y="656" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">the floor · work already done, not thrown away</text>
</svg>
</div>
</body>
</html>
