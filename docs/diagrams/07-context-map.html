<style>

  <title id="context-map-title">How the contexts relate</title>
  <desc id="context-map-desc">Context map of FakeStore Android: the catalog and favorites contexts integrate only in presentation, where each ui module uses the other context's domain; both domains depend on a shared kernel with ProductId and AppError; the catalog's data module reaches the external Fake Store API through an anti-corruption layer; an own API behind :shared:contract and an :audit context are planned.</desc>

    <marker id="arrow-planned" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8a8a82"/></marker>
