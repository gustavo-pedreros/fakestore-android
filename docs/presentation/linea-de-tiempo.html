<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuatro días, quince pull requests</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper: #fafaf7; --ink: #0b0b0c; --muted: #5c5c56; --accent: #c62a1b;
    --sans: 'Space Grotesk', system-ui, sans-serif; --serif: 'Instrument Serif', serif; --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--sans); background: var(--paper); color: var(--ink);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;
  }
  .frame { max-width: 1280px; width: 100%; }
  svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="linea-de-tiempo-title linea-de-tiempo-desc">
  <title id="linea-de-tiempo-title">Cuatro días, quince pull requests</title>
  <desc id="linea-de-tiempo-desc">Línea de tiempo de los cuatro días de construcción de FakeStore Android, de viernes a lunes: las fundaciones y la red el viernes, el design system completo el sábado, el domingo la infraestructura de build extraída tarde junto con Room, la corrección del precio y el catálogo, y el lunes la capa de presentación y el contexto de favoritos entero. Dos hitos marcados en coral: el design system antes que la primera pantalla, y favoritos agregado completo al final.</desc>

    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5c5c56"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c62a1b"/></marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3e5c76"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#fafaf7"/>

  <text x="40" y="60" fill="#5c5c56" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" letter-spacing="0.18em">CÓMO SE CONSTRUYÓ · FAKESTORE ANDROID</text>
  <text x="40" y="108" fill="#0b0b0c" font-size="40" font-family="'Instrument Serif', serif" font-weight="400" letter-spacing="-0.01em">Cuatro días, quince pull requests</text>
  <text x="40" y="132" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" letter-spacing="0.02em">126 commits · ninguna etapa reescribió la anterior: crecer fue agregar módulos</text>

  <!-- day bands -->
  <rect x="96" y="176" width="276" height="424" fill="rgba(11,11,12,0.022)"/>
  <rect x="648" y="176" width="276" height="424" fill="rgba(11,11,12,0.022)"/>
  <line x1="96" y1="176" x2="96" y2="600" stroke="rgba(11,11,12,0.08)" stroke-width="0.8"/>
  <line x1="372" y1="176" x2="372" y2="600" stroke="rgba(11,11,12,0.08)" stroke-width="0.8"/>
  <line x1="648" y1="176" x2="648" y2="600" stroke="rgba(11,11,12,0.08)" stroke-width="0.8"/>
  <line x1="924" y1="176" x2="924" y2="600" stroke="rgba(11,11,12,0.08)" stroke-width="0.8"/>
  <line x1="1200" y1="176" x2="1200" y2="600" stroke="rgba(11,11,12,0.08)" stroke-width="0.8"/>

  <text x="234" y="204" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">VIERNES 21</text>
  <text x="234" y="222" fill="#8a8a82" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">PR #1–2</text>
  <text x="510" y="204" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">SÁBADO 22</text>
  <text x="510" y="222" fill="#8a8a82" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">PR #3</text>
  <text x="786" y="204" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">DOMINGO 23</text>
  <text x="786" y="222" fill="#8a8a82" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">PR #4–9</text>
  <text x="1062" y="204" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" text-anchor="middle" letter-spacing="0.14em">LUNES 24</text>
  <text x="1062" y="222" fill="#8a8a82" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.10em">PR #10–15</text>

  <!-- editorial aside -->
  <text x="1200" y="256" fill="#5c5c56" font-size="16" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="end">el lunes cierran los cuatro requisitos</text>

  <line x1="510" y1="404" x2="510" y2="452" stroke="#c62a1b" stroke-opacity="0.45" stroke-width="0.8"/>
  <line x1="868" y1="404" x2="868" y2="452" stroke="rgba(11,11,12,0.28)" stroke-width="0.8"/>
  <line x1="1108" y1="404" x2="1108" y2="452" stroke="#c62a1b" stroke-opacity="0.45" stroke-width="0.8"/>
  <line x1="756" y1="404" x2="756" y2="524" stroke="rgba(11,11,12,0.28)" stroke-width="0.8"/>

  <circle cx="234" cy="400" r="4" fill="#0b0b0c"/>

  <text x="234" y="344" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Either · AppError · red</text>

  <circle cx="510" cy="400" r="6" fill="#c62a1b"/>
  <text x="510" y="468" fill="#c62a1b" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">Design system</text>
  <text x="510" y="484" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">átomos → organismos</text>

  <circle cx="700" cy="400" r="4" fill="#0b0b0c"/>
  <text x="700" y="328" fill="#0b0b0c" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">build-logic</text>
  <text x="700" y="344" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">7 convention plugins</text>

  <text x="756" y="556" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">el driver falla 2 veces</text>

  <circle cx="812" cy="400" r="4" fill="#0b0b0c"/>
  <text x="812" y="256" fill="#0b0b0c" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">Precio → Double</text>
  <text x="812" y="272" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">ADR-0003 corrige ADR-0002</text>

  <circle cx="868" cy="400" r="4" fill="#0b0b0c"/>
  <text x="868" y="468" fill="#0b0b0c" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">Catálogo</text>
  <text x="868" y="484" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">dominio + datos</text>

  <circle cx="1000" cy="400" r="4" fill="#0b0b0c"/>
  <text x="1000" y="328" fill="#0b0b0c" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">Catálogo UI</text>
  <text x="1000" y="344" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">el corazón, desconectado</text>

  <circle cx="1108" cy="400" r="6" fill="#c62a1b"/>
  <text x="1108" y="468" fill="#c62a1b" font-size="16" font-weight="600" font-family="'Space Grotesk', system-ui, sans-serif" text-anchor="middle">Favoritos</text>
  <text x="1108" y="484" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">3 módulos de una vez</text>

  <!-- legend -->
  <line x1="40" y1="636" x2="1240" y2="636" stroke="rgba(11,11,12,0.12)" stroke-width="0.8"/>
  <text x="40" y="656" fill="#5c5c56" font-size="8" font-family="'JetBrains Mono', ui-monospace, monospace" font-weight="500" letter-spacing="0.14em">LEYENDA</text>
  <circle cx="152" cy="652" r="4" fill="#0b0b0c"/>
  <text x="168" y="656" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">bloque de trabajo, un pull request</text>
  <circle cx="480" cy="652" r="6" fill="#c62a1b"/>
  <text x="496" y="656" fill="#5c5c56" font-size="12" font-family="'JetBrains Mono', ui-monospace, monospace">los dos hitos que prueban la flexibilidad de la arquitectura</text>

</div>
